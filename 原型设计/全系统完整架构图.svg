    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#667085" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <style>
      .title{font:500 24px sans-serif;fill:#17212b}.h{font:500 17px sans-serif;fill:#17212b}.b{font:400 14px sans-serif;fill:#344054}.s{font:400 12px sans-serif;fill:#667085}.line{fill:none;stroke:#667085;stroke-width:1.5;marker-end:url(#arrow)}.dash{fill:none;stroke:#98a2b3;stroke-width:1.2;stroke-dasharray:6 5;marker-end:url(#arrow)}
    </style>
  </defs>
