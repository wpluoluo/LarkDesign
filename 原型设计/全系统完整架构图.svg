<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 1260" width="1500" height="1260" role="img" aria-labelledby="title desc">
  <title id="title">鸿蒙原生通用平面设计软件全系统完整架构图</title>
  <desc id="desc">展示 HarmonyOS、OpenHarmony 与未来 Windows 客户端共用的设计软件完整架构，包含 Casdoor 统一用户中心、Go API、按产品作用域的钱包账本、Fusion DOM、本地引擎、开放格式、作业治理和会员授权。</desc>
