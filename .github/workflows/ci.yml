name: LarkDesign CI

on:
  push:
    branches: [master, main, develop]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run tests
        run: pnpm test
      - name: Type check
        run: pnpm typecheck
      - name: Verify formal project boundary
        run: pnpm verify:formal
      - name: Build frozen reference only
        run: pnpm build

  license-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: List licenses
        run: pnpm licenses list

  harmony-build:
    if: ${{ vars.HARMONY_CI == 'true' }}
    runs-on: [self-hosted, windows, harmonyos]
    steps:
      - uses: actions/checkout@v4
      - name: Build HarmonyOS HAP
        shell: pwsh
        run: ./scripts/build-harmony.ps1 -Task assembleHap
